# DirectChat Plugin Configuration

# Global password for authentication
# Players must provide this password to authenticate via DirectChat mod
password: "changeme"

# API server port
# The embedded HTTP server will listen on this port
port: 36769

# HTTPS settings
# Set to true to require SSL/TLS (you must provide keystore)
require-https: false
keystore-path: ""
keystore-password: ""

# Captcha provider integration
# Options: none, nantibot, captcha-api
captcha-provider: none

# Message history settings
# Maximum number of messages to keep in memory for /api/fetch
message-history-size: 100

# Token expiry time in seconds (0 = never expires)
token-expiry: 3600

# Debug mode
debug: false

# Cloudflared Tunnel Mode
# Set to true to automatically create a Cloudflare Quick Tunnel when the server starts.
# This is useful for servers that cannot open ports manually
# (e.g., Aternos, Play.hosting, or servers behind strict NAT/firewalls).
# The tunnel creates a public HTTPS URL that routes to the local API port.
#
# Requirements:
#   - 'cloudflared' must be installed on the server system
#   - Download from: https://github.com/cloudflare/cloudflared/releases
#
# When enabled, the plugin will:
#   1. Start the API server on localhost:{port}
#   2. Launch 'cloudflared tunnel --url http://localhost:{port}'
#   3. Print the public tunnel URL in the console
#   4. Broadcast the URL to all online admins
cloudflared-tunnel-mode: false

# Cloudflared binary path
# Leave empty ("") to use the default 'cloudflared' from system PATH.
# Set to a full path if cloudflared is installed in a non-standard location
# (e.g., "/usr/local/bin/cloudflared" or "C:\\Tools\\cloudflared.exe")
cloudflared-path: ""

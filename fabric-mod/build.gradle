plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/directchat.accesswidener")
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Fabric loader and API
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // GSON for JSON handling (bundled with Minecraft but declare for clarity)
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Disable Javadoc generation entirely
tasks.withType(Javadoc).configureEach {
    enabled = false
}

// Additional fix for Loom namespace issues
project.afterEvaluate {
    if (tasks.findByName("genSources")) {
        tasks.named("genSources").configure {
            enabled = false
        }
    }
}
